apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-condo
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: my-condo
  template:
    metadata:
      labels:
        app: my-condo
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: my-condo:replace-before-deploying
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: my-condo
          env:
            - name: PORT
              value: '8080'
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
            - name: application-temporary
              mountPath: /app/tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 32Mi
        - name: application-temporary
          emptyDir:
            sizeLimit: 32Mi
