[package]
name = "condo-app"
version = "1.4.0"
description = "Application services for Meu Condominio (everything the UI calls, minus the UI)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
condo-core = { path = "../condo-core" }
condo-audit = { path = "../condo-audit" }
condo-db = { path = "../condo-db" }
condo-mail = { path = "../condo-mail" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "6.0.0"
condo-update = { path = "../condo-update" }
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
