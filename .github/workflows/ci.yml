name: CI/CD
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: condo
          POSTGRES_PASSWORD: testing-only
          POSTGRES_DB: my_condo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U condo -d my_condo_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: condo
      DB_PASSWORD: testing-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Configure test environment
        run: |
          cp .env.example .env
          node ace generate:key
      - name: Type-check
        run: yarn typecheck
      - name: Lint
        run: yarn lint
      - name: Build application
        run: yarn build
      - name: Run unit tests
        run: yarn test unit
      - name: Run functional tests
        run: yarn test functional

  container:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: my-condo:smoke
          cache-from: type=gha,scope=container-smoke
          cache-to: type=gha,mode=max,scope=container-smoke
      - name: Start production image and run migrations
        run: docker compose -p condo-smoke -f compose.smoke.yaml up -d --no-build --wait --wait-timeout 120
      - name: Verify non-root runtime, pages, assets, and secret exclusion
        run: |
          docker compose -p condo-smoke -f compose.smoke.yaml exec -T app node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { access, readFile } from 'node:fs/promises'
          assert.notEqual(process.getuid(), 0)
          await assert.rejects(access('.env'))
          const base = `http://127.0.0.1:${process.env.PORT}`
          for (const path of ['/health/live', '/health/ready', '/login']) {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(5000) })
            assert.equal(response.status, 200, path)
          }
          const manifest = JSON.parse(await readFile('public/assets/.vite/manifest.json', 'utf8'))
          const asset = manifest['inertia/app/app.tsx'].file
          assert.equal((await fetch(`${base}/assets/${asset}`)).status, 200)
          console.log('Production container smoke checks passed')
          JS
      - name: Container logs on failure
        if: failure()
        run: docker compose -p condo-smoke -f compose.smoke.yaml logs --no-color
      - name: Clean up isolated smoke stack
        if: always()
        run: docker compose -p condo-smoke -f compose.smoke.yaml down -v

  publish:
    needs: container
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=container-release
          cache-to: type=gha,mode=max,scope=container-release

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Confirm this is still the latest main commit
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          latest_main="$(git rev-parse origin/main)"
          if [ "$latest_main" != "$GITHUB_SHA" ]; then
            printf 'This deployment is stale: main is now %s, not %s. Approve the latest run instead.\n' "$latest_main" "$GITHUB_SHA" >&2
            exit 1
          fi
      - name: Validate deployment configuration
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "$DEPLOY_SSH_HOST" ] || { printf 'Missing DEPLOY_SSH_HOST.\n' >&2; exit 1; }
          [ -n "$DEPLOY_SSH_USER" ] || { printf 'Missing DEPLOY_SSH_USER.\n' >&2; exit 1; }
          [ -n "$DEPLOY_PATH" ] || { printf 'Missing DEPLOY_PATH.\n' >&2; exit 1; }
          [ -n "$DEPLOY_SSH_PRIVATE_KEY" ] || { printf 'Missing DEPLOY_SSH_PRIVATE_KEY.\n' >&2; exit 1; }
          [ -n "$DEPLOY_SSH_KNOWN_HOSTS" ] || { printf 'Missing DEPLOY_SSH_KNOWN_HOSTS.\n' >&2; exit 1; }
          case "$DEPLOY_PATH" in
            /*) ;;
            *) printf 'DEPLOY_PATH must be an absolute path.\n' >&2; exit 1 ;;
          esac
          if [ "$DEPLOY_PATH" = "/" ]; then
            printf 'DEPLOY_PATH cannot be the filesystem root.\n' >&2
            exit 1
          fi
          case "$DEPLOY_PATH" in
            *[!a-zA-Z0-9_./-]*|*..*)
              printf 'DEPLOY_PATH may contain only letters, numbers, dots, underscores, slashes, and hyphens; ".." is not allowed.\n' >&2
              exit 1
              ;;
          esac
      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
      - name: Copy deployment files and deploy the published image
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          target="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          ssh_options=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${ssh_options[@]}" "$target" "mkdir -p -- '$DEPLOY_PATH'"
          scp "${ssh_options[@]}" compose.cloud.yaml Caddyfile deploy/upcloud-release.sh "$target:$DEPLOY_PATH/"
          printf -v remote_command 'cd %q && chmod 700 upcloud-release.sh && ./upcloud-release.sh %q' "$DEPLOY_PATH" "$IMAGE"
          ssh "${ssh_options[@]}" "$target" "$remote_command"

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
