name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: condo
          POSTGRES_PASSWORD: testing-only
          POSTGRES_DB: my_condo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U condo -d my_condo_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: condo
      DB_PASSWORD: testing-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: cp .env.example .env
      - run: node ace generate:key
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn build
      - run: yarn test

  container:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: my-condo:smoke
          cache-from: type=gha,scope=container-smoke
          cache-to: type=gha,mode=max,scope=container-smoke
      - name: Start production image and run migrations
        run: docker compose -p condo-smoke -f compose.smoke.yaml up -d --no-build --wait --wait-timeout 120
      - name: Verify non-root runtime, pages, assets, and secret exclusion
        run: |
          docker compose -p condo-smoke -f compose.smoke.yaml exec -T app node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { access, readFile } from 'node:fs/promises'
          assert.notEqual(process.getuid(), 0)
          await assert.rejects(access('.env'))
          const base = `http://127.0.0.1:${process.env.PORT}`
          for (const path of ['/health/live', '/health/ready', '/login']) {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(5000) })
            assert.equal(response.status, 200, path)
          }
          const manifest = JSON.parse(await readFile('public/assets/.vite/manifest.json', 'utf8'))
          const asset = manifest['inertia/app/app.tsx'].file
          assert.equal((await fetch(`${base}/assets/${asset}`)).status, 200)
          console.log('Production container smoke checks passed')
          JS
      - name: Container logs on failure
        if: failure()
        run: docker compose -p condo-smoke -f compose.smoke.yaml logs --no-color
      - name: Clean up isolated smoke stack
        if: always()
        run: docker compose -p condo-smoke -f compose.smoke.yaml down -v

  publish:
    needs: container
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=container-release
          cache-to: type=gha,mode=max,scope=container-release
