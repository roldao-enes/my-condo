# Meu Condominio desktop app: check on every OS, build one executable per OS, and publish those
# executables to GHCR (as OCI artifacts, fetched with `oras`; see docs/desktop-delivery.md).
name: Desktop

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/ci/linux-deps.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee test.log || status=$?
          # Surface failures as annotations so they show on the run without opening the log.
          grep -E "^test .* FAILED|panicked at|^error(\[|:)" test.log | head -25 | while IFS= read -r line; do
            echo "::error title=cargo test::${line:0:400}"
          done
          exit "${status:-0}"

  build:
    name: Build (${{ matrix.platform }})
    needs: check
    # Build even if a check failed, so one platform's failure does not hide the others;
    # publishing below still needs every check to pass.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built on the oldest runner image so the executable runs on most distros.
          - { platform: linux-x64, os: ubuntu-22.04, targets: "" }
          - { platform: windows-x64, os: windows-latest, targets: "" }
          - { platform: macos, os: macos-latest, targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/ci/linux-deps.sh
      - name: Build, self-check and stage the executable
        env:
          UNIVERSAL: ${{ matrix.platform == 'macos' && '1' || '0' }}
        run: ./scripts/build-release.sh
      # PR builds are not published, but this lets anyone download and try them.
      - uses: actions/upload-artifact@v4
        with:
          name: meu-condominio-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to GHCR
    needs: [check, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: meu-condominio-*
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.2.3
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Push one executable per OS
        run: |
          set -euo pipefail
          base="ghcr.io/${GITHUB_REPOSITORY,,}/desktop"
          tags="sha-${GITHUB_SHA}"
          case "$GITHUB_REF" in
            refs/tags/v*) tags="$tags,${GITHUB_REF_NAME#v}" ;;
            refs/heads/main) tags="$tags,latest" ;;
          esac
          for platform in windows-x64 linux-x64 macos; do
            dir="artifacts/meu-condominio-$platform"
            file="$(ls "$dir")"
            (cd "$dir" && oras push "$base/$platform:$tags" \
              --artifact-type application/vnd.meu-condominio.executable.v1 \
              --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --annotation "org.opencontainers.image.title=Meu Condominio ($platform)" \
              "$file:application/octet-stream")
            # Prove what was pushed is byte-for-byte what was built.
            check="$(mktemp -d)"
            oras pull "$base/$platform:sha-${GITHUB_SHA}" --output "$check"
            cmp "$dir/$file" "$check/$file"
            {
              echo "### $platform"
              echo '```'
              echo "oras pull $base/$platform:${tags##*,}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
