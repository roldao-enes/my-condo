# Meu Condominio desktop app: check on every OS, then package it for each OS with the same
# scripts you can run locally (see docs/packaging.md). On every push to main (a merge) the checks
# run first, then the packages of all three OSs are attached to a new GitHub release.
name: Desktop

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/ci/linux-deps.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee test.log || status=$?
          # Show failures as one annotation on the run, so they can be read without the log.
          # (`|| true`: finding nothing is not an error.)
          details="$(grep -E -A6 "^test .* FAILED|panicked at|^error(\[|:)" test.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", substr($0, 1, 300)}' || true)"
          if [ -n "$details" ]; then echo "::error title=cargo test::${details}"; fi
          exit "${status:-0}"

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  package:
    name: Package (${{ matrix.platform }})
    needs: check
    # Package even if a check failed, so one platform's failure does not hide the others.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built on the oldest runner image so the package works on most distros.
          - platform: linux-x64
            os: ubuntu-22.04
            targets: ""
            script: ./scripts/package-linux.sh
            files: dist/linux-x64/*.deb
          - platform: windows-x64
            os: windows-latest
            targets: ""
            script: ./scripts/build-release.sh
            files: dist/windows-x64/meu-condominio.exe
          - platform: macos
            os: macos-latest
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            script: ./scripts/package-macos.sh
            files: |
              dist/macos/*.zip
              dist/macos/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/ci/linux-deps.sh
      - name: Package, self-check and test the result
        env:
          UNIVERSAL: ${{ matrix.platform == 'macos' && '1' || '0' }}
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: meu-condominio-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    needs: [check, licenses, package]
    # Only when every check and every package succeeded, on a merge to main (or a pushed v* tag).
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.licenses.result == 'success' && needs.package.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: meu-condominio-*
          path: artifacts
          merge-multiple: false
      - name: Create the release with the packages of all three OSs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            target_args=()
          else
            version="$(grep -m1 '^version' crates/condo-app/Cargo.toml | cut -d'"' -f2)"
            tag="v${version}-build.${GITHUB_RUN_NUMBER}"
            target_args=(--target "$GITHUB_SHA")
          fi
          mapfile -t files < <(find artifacts -type f | sort)
          gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" "${target_args[@]}" \
            --title "$tag" --generate-notes
