# On every push to main: work out the next version from the Conventional Commits since the last
# release (fix -> PATCH, feat -> MINOR, breaking -> MAJOR; docs/chore/ci/... -> no release), commit
# the bump, tag it and start the Desktop workflow on the tag, which builds and publishes the signed
# release (docs/updates.md). Needs a main that this workflow may push to.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump, tag and start the release build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(scripts/release/next-version.sh)"
          if [[ -z "$version" ]]; then
            echo "No fix/feat/breaking commits since the last release: nothing to release."
            exit 0
          fi
          echo "Releasing v$version"
          scripts/release/bump.sh "$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$version"
          git tag -a "v$version" -m "v$version"
          git push --atomic origin HEAD:main "v$version"
          # Pushes made with GITHUB_TOKEN do not trigger workflows, so start the build explicitly.
          gh workflow run desktop.yml --ref "v$version"
