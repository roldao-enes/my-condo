# Every commit in a pull request must follow Conventional Commits (docs/contributing.md): the
# release version is derived from them.
name: Commits

on:
  pull_request:

permissions:
  contents: read

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/ci/check-commits.sh "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
