x-application: &application
  image: ${APP_IMAGE:-my-condo:local}
  build: .
  environment:
    NODE_ENV: production
    TZ: UTC
    PORT: 8080
    HOST: 0.0.0.0
    LOG_LEVEL: info
    APP_KEY: ${APP_KEY:?Set a unique APP_KEY}
    SESSION_DRIVER: cookie
    LIMITER_STORE: database
    DB_HOST: database
    DB_PORT: 5432
    DB_USER: condo
    DB_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
    DB_DATABASE: my_condo
    DB_SSL_MODE: disable
    DB_POOL_MAX: 5
    TRUST_PROXY: uniquelocal
  security_opt:
    - no-new-privileges:true
  read_only: true
  cap_drop: [ALL]
  tmpfs:
    - /tmp
    - /app/tmp:uid=1000,gid=1000,mode=0700

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: condo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
      POSTGRES_DB: my_condo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U condo -d my_condo]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *application
    command: [node, ace, migration:run, --force]
    healthcheck:
      disable: true
    depends_on:
      database:
        condition: service_healthy

  app:
    <<: *application
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:'+process.env.PORT+'/health/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to your public hostname}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
