# Dependency policy, checked in CI (`cargo deny check licenses`). The project is GPL-3.0-or-later,
# so only licenses that can be combined into a GPLv3 work are allowed.
[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "MPL-2.0", "0BSD", "BSL-1.0", "CDLA-Permissive-2.0", "GPL-3.0-only", "GPL-3.0-or-later",
]
